<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ameblo Drafts Viewer</title>
<style>
  :root {
    --card-bg: rgba(255, 255, 255, 0.55);
    --card-border: rgba(0, 150, 90, 0.22);
    --text-main: #1f3a2d;
    --text-sub: #5f7d6c;
    --accent: #00a960;
    --accent-dark: #00893f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #eef8f0;
    color: var(--text-main);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
  }

  body {
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at top, #e3f6e8 0%, #eef8f0 55%, #f5faf3 100%);
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 2.2rem;
    margin: 0 0 8px;
    background: linear-gradient(120deg, #00c46f, #00a960 55%, #007a3d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.02em;
  }

  header p {
    color: var(--text-sub);
    margin: 0;
    font-size: 0.95rem;
  }

  #status {
    text-align: center;
    color: var(--text-sub);
    margin-bottom: 24px;
    min-height: 1.2em;
  }

  .token-settings {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .token-toggle-btn {
    appearance: none;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--accent-dark);
    font-size: 0.82rem;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .token-toggle-btn:hover {
    border-color: var(--accent);
  }

  a.token-toggle-btn {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }

  .token-box {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 360px);
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 12px 32px rgba(0, 130, 70, 0.18);
    z-index: 5;
    display: none;
  }

  .token-box.open {
    display: block;
  }

  .token-box label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 6px;
  }

  .token-box input {
    width: 100%;
    font-size: 0.85rem;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.8);
    color: var(--text-main);
  }

  .token-box input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .token-note {
    margin: 8px 0 0;
    font-size: 0.75rem;
    color: var(--text-sub);
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 22px 26px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 130, 70, 0.12);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(0, 169, 96, 0.5);
    box-shadow: 0 12px 40px rgba(0, 130, 70, 0.2);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    cursor: pointer;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-main);
  }

  .card-date {
    font-size: 0.82rem;
    color: var(--accent);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .card-header-right {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }

  .card-delete-btn {
    appearance: none;
    border: none;
    background: transparent;
    font-size: 1rem;
    line-height: 1;
    padding: 2px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .card-delete-btn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  .card-toggle {
    margin-top: 14px;
    display: none;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.5);
  }

  .card-toggle.open {
    display: block;
  }

  .card-toggle-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 10px;
    background: rgba(0, 169, 96, 0.08);
    border-bottom: 1px solid var(--card-border);
  }

  .mode-tabs {
    display: flex;
    gap: 6px;
  }

  .tab-btn {
    appearance: none;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.6);
    color: var(--text-sub);
    font-size: 0.78rem;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .tab-btn:hover:not(.active) {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .toggle-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .action-btn,
  .card-close-btn {
    appearance: none;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.7);
    color: var(--accent-dark);
    font-size: 0.8rem;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .action-btn:hover,
  .card-close-btn:hover {
    background: #fff;
    border-color: var(--accent);
  }

  .action-btn.save-btn {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .action-btn.save-btn:hover {
    background: var(--accent-dark);
  }

  .action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .card-toggle iframe {
    width: 100%;
    height: 420px;
    border: none;
    background: #f4f4f6;
    display: block;
  }

  .card-editor {
    width: 100%;
    height: 420px;
    box-sizing: border-box;
    border: none;
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.8rem;
    line-height: 1.5;
    padding: 14px;
    resize: vertical;
    display: block;
  }

  .hidden-el {
    display: none !important;
  }

  .card-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-sub);
    text-decoration: none;
    border-bottom: 1px dashed var(--text-sub);
  }

  .card-link:hover { color: var(--accent-dark); border-color: var(--accent-dark); }

  .empty, .error {
    text-align: center;
    color: var(--text-sub);
    padding: 40px 0;
  }

  .error { color: #d64545; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Ameblo Drafts</h1>
      <p>drafts/ 配下の下書き一覧（新しい順）</p>
    </header>

    <div class="token-settings">
      <button type="button" id="tokenToggleBtn" class="token-toggle-btn">🔑 トークン設定</button>
      <a href="https://github.com/Miyagi28/ameblo-drafts/edit/main/profile/topics-queue.md" target="_blank" rel="noopener noreferrer" class="token-toggle-btn">📝 ネタ帳を編集</a>
      <div class="token-box" id="tokenBox">
        <label for="ghToken">GitHub Personal Access Token（削除・保存操作に使用）</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <p class="token-note">このブラウザに保存されます</p>
      </div>
    </div>

    <div id="status">読み込み中...</div>
    <div class="card-list" id="card-list"></div>
  </div>

<script>
(function () {
  const REPO_OWNER = "Miyagi28";
  const REPO_NAME = "ameblo-drafts";
  const BRANCH = "main";

  const TOKEN_KEY = "amebloDraftsGhToken";

  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("card-list");
  const tokenSettingsEl = document.querySelector(".token-settings");
  const tokenToggleBtn = document.getElementById("tokenToggleBtn");
  const tokenBox = document.getElementById("tokenBox");
  const tokenInput = document.getElementById("ghToken");

  function updateTokenButtonLabel() {
    tokenToggleBtn.textContent = localStorage.getItem(TOKEN_KEY)
      ? "🔑 トークン設定済み"
      : "🔑 トークン設定";
  }

  function openTokenBox() {
    tokenBox.classList.add("open");
    tokenInput.focus();
  }

  function closeTokenBox() {
    tokenBox.classList.remove("open");
  }

  tokenInput.value = localStorage.getItem(TOKEN_KEY) || "";
  updateTokenButtonLabel();

  tokenToggleBtn.addEventListener("click", () => {
    if (tokenBox.classList.contains("open")) {
      closeTokenBox();
    } else {
      openTokenBox();
    }
  });

  document.addEventListener("click", (e) => {
    if (!tokenSettingsEl.contains(e.target)) {
      closeTokenBox();
    }
  });

  tokenInput.addEventListener("change", () => {
    localStorage.setItem(TOKEN_KEY, tokenInput.value.trim());
    updateTokenButtonLabel();
  });

  tokenInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      localStorage.setItem(TOKEN_KEY, tokenInput.value.trim());
      updateTokenButtonLabel();
      closeTokenBox();
    }
  });

  function updateStatusCount() {
    const remaining = listEl.children.length;
    if (remaining === 0) {
      statusEl.textContent = "";
      listEl.innerHTML = '<div class="empty">まだ下書きがありません</div>';
    } else {
      statusEl.textContent = `${remaining} 件の下書き`;
    }
  }

  async function deleteDraft(file, cardEl) {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
      alert("削除にはGitHub Personal Access Tokenが必要です。トークンを入力してください。");
      openTokenBox();
      return;
    }
    if (!confirm(`「${file.name}」を本当に削除しますか？`)) return;

    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${file.path}`;
    try {
      const res = await fetch(apiUrl, {
        method: "DELETE",
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28",
        },
        body: JSON.stringify({
          message: `Delete draft: ${file.name}`,
          sha: file.sha,
          branch: BRANCH,
        }),
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `HTTP ${res.status}`);
      }
      cardEl.remove();
      updateStatusCount();
    } catch (err) {
      alert(`削除に失敗しました: ${err.message}`);
    }
  }

  const fallbackCopyEl = document.createElement("textarea");
  fallbackCopyEl.setAttribute("aria-hidden", "true");
  fallbackCopyEl.style.position = "fixed";
  fallbackCopyEl.style.top = "-9999px";
  fallbackCopyEl.style.left = "-9999px";
  document.body.appendChild(fallbackCopyEl);

  function fallbackCopyToClipboard(text) {
    fallbackCopyEl.value = text;
    fallbackCopyEl.focus();
    fallbackCopyEl.select();
    try {
      document.execCommand("copy");
    } catch (e) {
      /* noop */
    }
  }

  async function copyTextToClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      throw new Error("clipboard api unavailable");
    } catch (err) {
      fallbackCopyToClipboard(text);
    }
  }

  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    bytes.forEach((b) => {
      binary += String.fromCharCode(b);
    });
    return btoa(binary);
  }

  function flashButton(btn, tempText, originalText, delay) {
    btn.textContent = tempText;
    setTimeout(() => {
      btn.textContent = originalText;
    }, delay || 1500);
  }

  function extractDateFromName(name) {
    const m = name.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}/${m[2]}/${m[3]}`;
    return "";
  }

  async function extractTitle(path, fallback) {
    try {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) return fallback;
      const text = await res.text();
      const match = text.match(/<title[^>]*>([^<]*)<\/title>/i);
      if (match && match[1].trim()) return match[1].trim();
      return fallback;
    } catch (e) {
      return fallback;
    }
  }

  function createCard(file) {
    const card = document.createElement("div");
    card.className = "card";

    const top = document.createElement("div");
    top.className = "card-top";

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = file.name;

    const headerRight = document.createElement("div");
    headerRight.className = "card-header-right";

    const date = document.createElement("div");
    date.className = "card-date";
    date.textContent = extractDateFromName(file.name);

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "card-delete-btn";
    deleteBtn.textContent = "🗑️";
    deleteBtn.title = "削除";
    deleteBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteDraft(file, card);
    });

    headerRight.appendChild(date);
    headerRight.appendChild(deleteBtn);

    top.appendChild(title);
    top.appendChild(headerRight);

    const toggleArea = document.createElement("div");
    toggleArea.className = "card-toggle";

    // --- toolbar: mode tabs (preview/edit) + copy/save/close actions ---
    const toolbar = document.createElement("div");
    toolbar.className = "card-toggle-bar";

    const tabGroup = document.createElement("div");
    tabGroup.className = "mode-tabs";
    const previewTabBtn = document.createElement("button");
    previewTabBtn.type = "button";
    previewTabBtn.className = "tab-btn active";
    previewTabBtn.textContent = "👁️ プレビュー";
    const editTabBtn = document.createElement("button");
    editTabBtn.type = "button";
    editTabBtn.className = "tab-btn";
    editTabBtn.textContent = "✏️ 編集する";
    tabGroup.appendChild(previewTabBtn);
    tabGroup.appendChild(editTabBtn);

    const actionGroup = document.createElement("div");
    actionGroup.className = "toggle-actions";
    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "action-btn";
    copyBtn.textContent = "📋 コピー";
    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "action-btn save-btn hidden-el";
    saveBtn.textContent = "💾 保存";
    const closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "card-close-btn";
    closeBtn.textContent = "← 一覧に戻る";
    actionGroup.appendChild(copyBtn);
    actionGroup.appendChild(saveBtn);
    actionGroup.appendChild(closeBtn);

    toolbar.appendChild(tabGroup);
    toolbar.appendChild(actionGroup);

    closeBtn.addEventListener("click", () => {
      toggleArea.classList.remove("open");
    });

    // --- content: iframe preview + raw HTML editor ---
    const iframe = document.createElement("iframe");
    const textarea = document.createElement("textarea");
    textarea.className = "card-editor hidden-el";
    textarea.spellcheck = false;
    textarea.placeholder = "読み込み中...";

    let built = false; // toolbar/iframe/textarea appended to toggleArea
    let iframeLoaded = false; // iframe.src has been set
    let sourceLoaded = false; // textarea has fetched the raw source

    async function ensureSourceLoaded() {
      if (sourceLoaded) return;
      textarea.value = "";
      textarea.placeholder = "読み込み中...";
      try {
        const res = await fetch(file.downloadUrl, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        textarea.value = await res.text();
        sourceLoaded = true;
      } catch (err) {
        textarea.placeholder = "";
        alert(`ソースの取得に失敗しました: ${err.message}`);
      }
    }

    function setMode(mode) {
      if (mode === "edit") {
        editTabBtn.classList.add("active");
        previewTabBtn.classList.remove("active");
        textarea.classList.remove("hidden-el");
        iframe.classList.add("hidden-el");
        saveBtn.classList.remove("hidden-el");
        ensureSourceLoaded();
      } else {
        previewTabBtn.classList.add("active");
        editTabBtn.classList.remove("active");
        iframe.classList.remove("hidden-el");
        textarea.classList.add("hidden-el");
        saveBtn.classList.add("hidden-el");
        if (!iframeLoaded) {
          iframe.src = file.path;
          iframeLoaded = true;
        }
      }
    }

    previewTabBtn.addEventListener("click", () => setMode("preview"));
    editTabBtn.addEventListener("click", () => setMode("edit"));

    copyBtn.addEventListener("click", async () => {
      await ensureSourceLoaded();
      await copyTextToClipboard(textarea.value);
      flashButton(copyBtn, "✅ コピーしました", "📋 コピー");
    });

    saveBtn.addEventListener("click", async () => {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) {
        alert("保存にはGitHub Personal Access Tokenが必要です。トークンを入力してください。");
        openTokenBox();
        return;
      }
      if (!confirm(`「${file.name}」を上書き保存しますか？`)) return;

      const content = textarea.value;
      const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${file.path}`;
      saveBtn.disabled = true;
      saveBtn.textContent = "💾 保存中...";
      try {
        const res = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          },
          body: JSON.stringify({
            message: `Update draft: ${file.name}`,
            content: utf8ToBase64(content),
            sha: file.sha,
            branch: BRANCH,
          }),
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `HTTP ${res.status}`);
        }
        const data = await res.json();
        if (data.content && data.content.sha) file.sha = data.content.sha;

        const titleMatch = content.match(/<title[^>]*>([^<]*)<\/title>/i);
        if (titleMatch && titleMatch[1].trim()) title.textContent = titleMatch[1].trim();

        // force the preview iframe to reload the freshly saved content
        iframeLoaded = false;
        if (!iframe.classList.contains("hidden-el")) {
          iframe.src = `${file.path}?_=${Date.now()}`;
          iframeLoaded = true;
        }

        flashButton(saveBtn, "✅ 保存しました", "💾 保存");
        saveBtn.disabled = false;
      } catch (err) {
        alert(`保存に失敗しました: ${err.message}`);
        saveBtn.textContent = "💾 保存";
        saveBtn.disabled = false;
      }
    });

    top.addEventListener("click", () => {
      const isOpen = toggleArea.classList.toggle("open");
      if (isOpen && !built) {
        toggleArea.appendChild(toolbar);
        toggleArea.appendChild(iframe);
        toggleArea.appendChild(textarea);
        built = true;
        setMode("preview");
      }
    });

    const link = document.createElement("a");
    link.className = "card-link";
    link.href = file.path;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "新しいタブで開く ↗";

    card.appendChild(top);
    card.appendChild(toggleArea);
    card.appendChild(link);

    extractTitle(file.downloadUrl, file.name).then((t) => {
      title.textContent = t;
    });

    return card;
  }

  async function loadDrafts() {
    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/drafts?ref=${BRANCH}`;
    try {
      const res = await fetch(apiUrl, {
        headers: { Accept: "application/vnd.github+json" },
      });
      if (!res.ok) {
        throw new Error(`GitHub API error: ${res.status}`);
      }
      const data = await res.json();
      const files = data
        .filter((f) => f.type === "file" && f.name.toLowerCase().endsWith(".html"))
        .map((f) => ({ name: f.name, path: `drafts/${f.name}`, downloadUrl: f.download_url, sha: f.sha }))
        .sort((a, b) => (a.name < b.name ? 1 : -1));

      if (files.length === 0) {
        statusEl.textContent = "";
        listEl.innerHTML = '<div class="empty">まだ下書きがありません</div>';
        return;
      }

      statusEl.textContent = `${files.length} 件の下書き`;
      files.forEach((file) => listEl.appendChild(createCard(file)));
    } catch (err) {
      statusEl.textContent = "";
      listEl.innerHTML = `<div class="error">一覧の取得に失敗しました: ${err.message}</div>`;
    }
  }

  loadDrafts();
})();
</script>
</body>
</html>
